## OPENAPI
quarkus.smallrye-openapi.path=/api/receiver/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/receiver/q/swagger

## EXCEPTION
signomix.receiver.exception.api.param.missing=Missing request parameter

## OPEN TELEMTRY
quarkus.otel.service.name=${SIGNOMIX_RECEIVER_OTEL_NAME:signomix-ta-receiver}
quarkus.otel.exporter.otlp.endpoint=${otel_service_url}
quarkus.otel.exporter.otlp.headers=${otel_service_headers}
quarkus.otel.logs.enabled=true
quarkus.otel.logs.level=INFO
